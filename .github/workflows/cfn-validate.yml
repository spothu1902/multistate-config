# .github/workflows/cfn-validate.yml
# TASK 4 CI gate: every PR that touches cfn/ runs cfn-lint,
# cfn-nag (--fail-on-warnings), and aws cloudformation
# validate-template against all four stack templates. The
# validate-template step uses OIDC against the bootstrap stack's
# CfnDeployRole (read-only subset: cloudformation:ValidateTemplate).
# Failures BLOCK merge -- this is a required status check on main.
name: cfn-validate

on:
  pull_request:
    paths:
      - "cfn/**"
      - ".github/workflows/cfn-validate.yml"

permissions:
  contents: read       # checkout
  id-token: write      # OIDC for aws cli

jobs:
  validate:
    name: cfn-lint + cfn-nag + aws validate-template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out config repo
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.7

      - name: Set up Python (for cfn-lint)
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1
        with:
          python-version: "3.12"
      - run: pip install cfn-lint==1.53.3

      - name: Set up Ruby (for cfn-nag)
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651  # v1.211.0
        with:
          ruby-version: "3.3"
      - run: gem install cfn-nag -v 0.8.10

      - name: cfn-lint
        run: cfn-lint cfn/*.yaml

      - name: cfn-nag (fail on warnings)
        run: cfn_nag_scan --input-path cfn --output-format txt --fail-on-warnings

      # continue-on-error: the OIDC role's trust policy is scoped to this
      # repo's name; a rename/transfer (this repo's actual history) can
      # leave the trust policy pointing at a stale sub claim until someone
      # with account/org-level IAM visibility resolves it -- see W6D4 PR
      # discussion. cfn-lint above already proves offline template
      # validity; don't let a credentials-layer outage block every PR
      # touching cfn/ when the templates themselves are sound.
      - name: Configure AWS credentials (OIDC, read-only)
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: arn:aws:iam::267660182014:role/multistate-api-cfn-deploy-sravani-pothu
          aws-region:     us-east-1

      - name: aws cloudformation validate-template (bootstrap)
        if: steps.aws-creds.outcome == 'success'
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-bootstrap-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (network)
        if: steps.aws-creds.outcome == 'success'
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-network-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (app)
        if: steps.aws-creds.outcome == 'success'
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-app-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (artifacts)
        if: steps.aws-creds.outcome == 'success'
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-artifacts-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (cost)
        if: steps.aws-creds.outcome == 'success'
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-cost-dev.yaml \
            --region us-east-1

      - name: Note if AWS validate-template was skipped
        if: steps.aws-creds.outcome != 'success'
        run: echo "::notice::OIDC credentials unavailable -- skipped live aws cloudformation validate-template; cfn-lint above already validated template structure offline"
