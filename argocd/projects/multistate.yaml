# argocd/projects/multistate.yaml
# AppProject scoping the multistate capstone team.
# The platform team owns this file in practice; the app team
# proposes changes via PR. Every Application in this project has
# spec.project = multistate -- never "default".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: multistate
  namespace: argocd
  # Finalizer ensures Argo CD prunes generated Applications when
  # the project itself is deleted -- a defence against orphaned
  # workloads if the project is ever retired.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: multistate-api capstone -- GitOps overlays + observability

  # WHICH repos may an Application in this project use as source?
  # Narrowed to exactly this gitops repo -- a wildcard here is
  # indistinguishable from leaving the project in "default".
  sourceRepos:
    - https://github.com/spothu1902/multistate-config.git

  # WHICH (cluster, namespace) pairs are legal? Explicit per-env
  # entries, never {server: '*', namespace: '*'}.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: multistate-dev
    - server: https://kubernetes.default.svc
      namespace: multistate-staging
    - server: https://kubernetes.default.svc
      namespace: multistate-prod

  # Cluster-scoped resources: the app team has NO business creating
  # ClusterRoles, CustomResourceDefinitions, or PersistentVolumes.
  # Namespace is the one exception -- it's cluster-scoped in
  # Kubernetes (unlike everything else base/ ships), and
  # base/00-namespace.yaml + syncOptions: [CreateNamespace=true]
  # both need it whitelisted here, not in namespaceResourceWhitelist.
  # Everything else stays denied. Platform team manages those.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }

  # Namespace-scoped resources: only the kinds the manifests
  # actually use. Anything else is denied.
  namespaceResourceWhitelist:
    - { group: "", kind: Service }
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Secret }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: monitoring.coreos.com, kind: ServiceMonitor }
    - { group: monitoring.coreos.com, kind: PrometheusRule }

  # Explicitly block quota knobs -- platform-owned.
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }

  # Sync windows: deny auto-sync to prod over the weekend.
  # Manual sync still works (manualSync: true), but the controller
  # will not promote on its own during the freeze.
  syncWindows:
    - kind: deny
      schedule: "0 17 * * 5" # Friday 17:00
      duration: 60h # through Monday 05:00
      applications:
        - "multistate-api-prod"
      manualSync: true

  # Project-scoped RBAC -- two roles, not "any-developer-is-admin".
  roles:
    # Developers: read + sync in dev/staging; cannot touch prod.
    - name: developers
      description: Read everything; sync dev and staging only.
      policies:
        - p, proj:multistate:developers, applications, get, multistate/*, allow
        - p, proj:multistate:developers, applications, sync, multistate/multistate-api-dev, allow
        - p, proj:multistate:developers, applications, sync, multistate/multistate-api-staging, allow
        - p, proj:multistate:developers, applications, delete, multistate/*, deny
        - p, proj:multistate:developers, logs, get, multistate/*, allow
      groups:
        - uptimecrew:multistate-engineers
    # Releasers: full sync including prod; still cannot override the
    # project's allow-lists (those live above), and cannot delete.
    - name: releasers
      description: Full sync including prod. Cannot delete Applications.
      policies:
        - p, proj:multistate:releasers, applications, get, multistate/*, allow
        - p, proj:multistate:releasers, applications, sync, multistate/*, allow
        - p, proj:multistate:releasers, applications, action/*, multistate/*, allow
        - p, proj:multistate:releasers, applications, delete, multistate/*, deny
      groups:
        - uptimecrew:multistate-engineers-releasers
