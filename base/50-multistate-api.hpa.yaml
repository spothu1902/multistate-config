# base/50-multistate-api.hpa.yaml
# TASK 2 (W6 D5, RUNNABLE): SLO-derived HPA on the custom Prometheus metric
# multistate_inflight_requests, fed via the Prometheus Adapter. Replaces the
# prior CPU-based HPA -- CPU stays low while p99 climbs on this LLM-API-bound
# service, so CPU utilization is blind to the actual SLO signal. Target 7
# comes from a single-replica saturation test (ramp one pod to the 500 ms
# p99 SLO). Do not also set spec.replicas on the Deployment -- KEDA/HPA own
# the count from here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multistate-api-hpa
  namespace: multistate-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       multistate-api
  minReplicas: 3
  maxReplicas: 28
  metrics:
    - type: Pods
      pods:
        metric:
          name: multistate_inflight_requests
        target:
          type: AverageValue
          averageValue: "7"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600   # W5 D3 callback: outlast a bursty dip
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
      selectPolicy: Max
