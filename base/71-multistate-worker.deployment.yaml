# base/71-multistate-worker.deployment.yaml
# TASK 1 (W6 D5): the KEDA scale target. Same image as multistate-api, run
# under the `worker` Spring profile: consumes tenants.events on consumer
# group multistate-read-model-builder (AllocationCreatedListener),
# re-projects the Mongo read model, serves no HTTP. Application.main reads
# SPRING_PROFILES_ACTIVE at boot and sets WebApplicationType.NONE when
# "worker" is present, so this Deployment declares no containerPort and no
# HTTP probes.
#
# replicas: 0 at rest. KEDA's ScaledObject (base/73-...) owns the replica
# count from here -- do NOT set replicas to anything else, or every
# reconcile fights KEDA's generated HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multistate-api-worker
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name:       multistate-api-worker
    app.kubernetes.io/component:  worker
    app.kubernetes.io/part-of:    multistate
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: multistate-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name:      multistate-api-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of:   multistate
      annotations:
        checksum/config: "replace-at-apply-time"
        checksum/secret: "replace-at-apply-time"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    65532
        fsGroup:      65532
      containers:
        - name:  worker
          image: uptimecrew/multistate-api:0.1.0     # same image as the api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: multistate-api-config }
            - secretRef:    { name: multistate-api-secrets }
          env:
            - name:  SPRING_PROFILES_ACTIVE
              value: "worker"
            - name:  JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   {             memory: 1Gi   }
