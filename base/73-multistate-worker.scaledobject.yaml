# base/73-multistate-worker.scaledobject.yaml
# TASK 1 (W6 D5, RUNNABLE on k3d): KEDA scales the tenants.events worker on
# Kafka consumer-group lag. lagThreshold: "10" means the generated HPA
# targets 10 messages of lag per pod. The dev Kafka broker is plaintext, so
# no TriggerAuthentication is needed here -- the credential-placement
# discipline (operator IRSA) lives in the AWS-authored SQS variant.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: multistate-worker-scaledobject
  namespace: multistate-dev
spec:
  scaleTargetRef:
    name: multistate-api-worker
  minReplicaCount: 0
  maxReplicaCount: 28
  pollingInterval: 15
  cooldownPeriod:  300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.multistate-dev.svc.cluster.local:9092
        consumerGroup: multistate-read-model-builder
        topic: tenants.events
        lagThreshold: "10"
        offsetResetPolicy: latest
