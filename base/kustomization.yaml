# base/kustomization.yaml
# The unchanged W5 D3 manifests, copied verbatim from the application
# repo's manifests/ directory. Every env overlay (dev/staging/prod)
# builds on this base via `resources: [../../base]` and applies its
# own namespace/replica/image/config patches on top.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-multistate-api.deployment.yaml
  - 20-multistate-api.service.yaml
  - 30-multistate-api.configmap.yaml
  - 40-multistate-api.secret.yaml
  - 50-multistate-api.hpa.yaml
  - 60-multistate-api.ingress.yaml
  - 70-multistate-api.servicemonitor.yaml
  - 71-multistate-worker.deployment.yaml
  - 72-multistate-api.pdb.yaml
  - 73-multistate-worker.scaledobject.yaml
  # 74-prometheus-adapter-values.yaml is a Helm values file, not a K8s
  # manifest -- deliberately excluded from `resources:` (kustomize would
  # try and fail to parse it as an API object).
