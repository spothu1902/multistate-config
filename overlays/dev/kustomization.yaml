# overlays/dev/kustomization.yaml
# The dev overlay -- the smallest viable patch over the base manifests.
# Same shape repeats at overlays/staging/ and overlays/prod/ (Task 3)
# with different namespace + replica + image-tag + config patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base: the unchanged W5 D3 manifests, copied verbatim into the
# config repo at base/. Kept identical across envs.
resources:
  - ../../base

# Per-env namespace -- Kustomize rewrites every resource's
# metadata.namespace at build time.
namespace: multistate-dev

# Image-tag rewrite -- the CI _bump-config workflow (Task 4/T5)
# rewrites the tag on every green main build; Kustomize merges it
# onto the rendered Deployment without touching the base manifest.
# The image lives in a private ECR repo (see application repo's
# CLAUDE.md), never docker.io -- base/10-...deployment.yaml's
# `uptimecrew/multistate-api:0.1.0` is rewritten to the full ECR URI.
#
# w6d5 (W6 D5): fd677fa's classpath is missing db/migration/V1__schema.sql
# entirely -- a pre-existing defect in that build, surfaced when Postgres's
# data was lost to an unrelated dev-cluster incident (see
# multistate-api/SRE-CAPSTONE.md). w6d5 is a from-source rebuild off the
# current main -- carries the correct V1 migration plus this week's worker
# profile (Task 1) and InflightRequestsGauge (Task 2) -- pushed to this same
# ECR repo and referenced here so the worker Deployment and the api
# Deployment's custom metric are both live on this tag.
images:
  - name: uptimecrew/multistate-api
    newName: 267660182014.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/multistate-api
    newTag: w6d5-t3-final

# Per-env replica count -- dev runs at one replica.
replicas:
  - name: multistate-api
    count: 1

# Per-env patches:
#  - ConfigMap: Spring profile + log level differ per env.
#  - Namespace sync-wave: the Namespace must land BEFORE the
#    Deployment/Service/etc. on a brand-new cluster (a Deployment
#    can't be created into a namespace that doesn't exist yet).
#    Patched onto just the Namespace kind -- NOT commonAnnotations,
#    which would stamp every resource in this overlay with the same
#    wave and lose the ordering entirely. This wave orders resources
#    WITHIN one Application; the ApplicationSet template's
#    argocd.argoproj.io/sync-wave (dev=0/staging=1/prod=2) separately
#    orders the three Applications relative to each other.
patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
  - target:
      kind: Namespace
      name: multistate-dev
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
