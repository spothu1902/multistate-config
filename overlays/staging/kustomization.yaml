# overlays/staging/kustomization.yaml
# Same shape as overlays/dev/ -- see that file for the full rationale
# on each knob. Staging runs 2 replicas, INFO logging, its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: multistate-staging

# fd677fa is the latest real tag pushed by CI as of this bootstrap;
# the CI _bump-config workflow (Task 4/T5) rewrites it per env.
images:
  - name: uptimecrew/multistate-api
    newName: 267660182014.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/multistate-api
    newTag: fd677fa

# Staging runs at 2 replicas -- closer to prod's HA posture than dev's 1.
replicas:
  - name: multistate-api
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: INFO
  # Namespace must land before Deployment/Service/etc. -- see
  # overlays/dev/kustomization.yaml for the full rationale.
  - target:
      kind: Namespace
      name: multistate-staging
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  # base/70-...servicemonitor.yaml hardcodes namespaceSelector to
  # multistate-dev; every overlay must rewrite it to its own
  # namespace or the ServiceMonitor watches the wrong namespace.
  - target:
      kind: ServiceMonitor
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames
        value: [multistate-staging]