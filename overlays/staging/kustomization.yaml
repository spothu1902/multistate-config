# overlays/staging/kustomization.yaml
# Same shape as overlays/dev/ -- see that file for the full rationale
# on each knob. Staging runs 2 replicas, INFO logging, its own namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: multistate-staging

# fd677fa is the latest real tag pushed by CI as of this bootstrap;
# the CI _bump-config workflow (Task 4/T5) rewrites it per env.
images:
  - name: uptimecrew/multistate-api
    newName: 267660182014.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/multistate-api
    newTag: fd677fa

# Staging runs at 2 replicas -- closer to prod's HA posture than dev's 1.
replicas:
  - name: multistate-api
    count: 2

patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: INFO
      # base/30-...configmap.yaml hardcodes every backend hostname to
      # *.multistate-dev.svc.cluster.local; every overlay must rewrite
      # these or staging/prod pods reach across namespaces into dev's
      # backing services (or find nothing, since dev's aren't there either).
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.multistate-staging.svc.cluster.local:5432/multistate_dev
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.multistate-staging.svc.cluster.local:27017/multistate
      - op: replace
        path: /data/SPRING_DATA_REDIS_HOST
        value: redis.multistate-staging.svc.cluster.local
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.multistate-staging.svc.cluster.local:9092
      - op: replace
        path: /data/OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otelcol.multistate-staging.svc.cluster.local:4317
  # Namespace must land before Deployment/Service/etc. -- see
  # overlays/dev/kustomization.yaml for the full rationale.
  - target:
      kind: Namespace
      name: multistate-staging
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  # base/70-...servicemonitor.yaml hardcodes namespaceSelector to
  # multistate-dev; every overlay must rewrite it to its own
  # namespace or the ServiceMonitor watches the wrong namespace.
  - target:
      kind: ServiceMonitor
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames
        value: [multistate-staging]
  # base/60-...ingress.yaml hardcodes host: multistate.dev.uptimecrew.internal;
  # every overlay must use a unique host or ingress-nginx's admission
  # webhook rejects the apply as a host+path collision with dev's Ingress.
  - target:
      kind: Ingress
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: multistate.staging.uptimecrew.internal